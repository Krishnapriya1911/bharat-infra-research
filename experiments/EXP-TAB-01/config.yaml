experiment:
  id: EXP-TAB-01
  name: LightGBM Infrastructure Delay Baseline
  seed: 42

data:
  source: MoSPI PAIMANA
  raw_path: datasets/raw/mospi/
  processed_path: datasets/processed/mospi_projects.csv

target:
  regression: delay_days
  classification: delay_over_20pct

split:
  strategy: temporal
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15

features:
  candidate:
    - sector
    - line_ministry
    - original_cost
    - expenditure
    - planned_duration_days

  prohibited:
    - revised_date
    - actual_completion_date
    - future_expenditure
    - future_progress

model:
  type: lightgbm

metrics:
  regression:
    - mae
    - rmse

  classification:
    - pr_auc
    - roc_auc
    - brier_score
